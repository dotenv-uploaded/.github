<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">Folding — a local-first document agent that reads, connects, and safely edits files</title>
  <desc id="description">A deep navy product banner showing local documents becoming a knowledge graph and then an approved edit, all inside the user's device.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060b1c"/>
      <stop offset="0.55" stop-color="#0d1630"/>
      <stop offset="1" stop-color="#16256b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bbccff"/>
      <stop offset="1" stop-color="#2b5dfd"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#2b5dfd" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#2b5dfd" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#background)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="1010" cy="76" r="306" fill="url(#glow)"/>
  <path d="M0 346 C206 292 362 404 602 344 C822 287 1012 360 1200 298 L1200 420 L0 420 Z" fill="#04060f" fill-opacity="0.54"/>

  <g font-family="Inter, Pretendard, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="72" y="60" width="330" height="38" rx="19" fill="#2b5dfd" fill-opacity="0.17" stroke="#bbccff" stroke-opacity="0.58"/>
    <circle cx="93" cy="79" r="5" fill="#16a46b"/>
    <text x="108" y="85" fill="#dbe4ff" font-size="15" font-weight="700" letter-spacing="1.05">RUNS ON YOUR MACHINE · NO API KEY</text>

    <text x="70" y="190" fill="#ffffff" font-size="68" font-weight="760" letter-spacing="-2.4">Fold</text>
    <text x="207" y="190" fill="url(#accent)" font-size="68" font-weight="760" letter-spacing="-2.4">ing</text>
    <text x="74" y="241" fill="#ccd3e6" font-size="24" font-weight="520">Reads your documents. Connects them. Edits only with approval.</text>
    <text x="74" y="284" fill="#8a92ab" font-size="17">HWP · DOCX · XLSX · PPTX · PDF — evidence kept from every source</text>
  </g>

  <g transform="translate(648,110) scale(0.9)" font-family="Inter, Pretendard, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="-16" y="4" width="536" height="176" rx="22" fill="#ffffff" fill-opacity="0.03" stroke="#bbccff" stroke-opacity="0.3" stroke-dasharray="6 7"/>
    <text x="252" y="172" fill="#7f88a4" font-size="12" text-anchor="middle" letter-spacing="1.6">YOUR DEVICE</text>

    <path d="M84 84 H146 M218 84 H280 M352 84 H414" fill="none" stroke="#bbccff" stroke-width="3" stroke-dasharray="7 9" stroke-linecap="round"/>

    <g>
      <rect x="16" y="44" width="68" height="80" rx="16" fill="#111c3d" stroke="#bbccff" stroke-opacity="0.8"/>
      <rect x="24" y="36" width="68" height="80" rx="16" fill="#16224a" stroke="#bbccff" stroke-opacity="0.9"/>
      <path d="M40 64 h36 M40 78 h28 M40 92 h32" stroke="#dbe4ff" stroke-width="3" stroke-linecap="round"/>
      <text x="58" y="150" fill="#7f88a4" font-size="13" text-anchor="middle">DOCS</text>
    </g>

    <g>
      <rect x="146" y="40" width="72" height="80" rx="18" fill="#152352" stroke="#bbccff"/>
      <circle cx="166" cy="62" r="7" fill="#2b5dfd"/>
      <circle cx="198" cy="72" r="7" fill="#bbccff"/>
      <circle cx="170" cy="96" r="7" fill="#16a46b"/>
      <path d="M166 62 L198 72 M198 72 L170 96 M170 96 L166 62" stroke="#dbe4ff" stroke-width="2" stroke-opacity="0.75"/>
      <text x="182" y="150" fill="#7f88a4" font-size="13" text-anchor="middle">GRAPH</text>
    </g>

    <g>
      <rect x="280" y="40" width="72" height="80" rx="18" fill="#152352" stroke="#f5a623" stroke-opacity="0.9"/>
      <path d="M316 58 v22" stroke="#f5a623" stroke-width="4" stroke-linecap="round"/>
      <circle cx="316" cy="92" r="3.5" fill="#f5a623"/>
      <path d="M300 106 h32" stroke="#f5a623" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6"/>
      <text x="316" y="150" fill="#7f88a4" font-size="13" text-anchor="middle">APPROVE</text>
    </g>

    <g>
      <rect x="414" y="40" width="72" height="80" rx="18" fill="#123b2c" stroke="#16a46b"/>
      <path d="M432 82 l12 12 l24 -28" fill="none" stroke="#6ce3a8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M432 62 h24" stroke="#6ce3a8" stroke-width="3" stroke-linecap="round" stroke-opacity="0.5"/>
      <text x="450" y="150" fill="#7f88a4" font-size="13" text-anchor="middle">NEW FILE</text>
    </g>
  </g>
</svg>
